server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # User Service (8081)
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            # Catalog Service (8082)
            - id: catalog-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/products/**

            # Cart Service (8083)
            - id: cart-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/carts/**

            # Order Service (8084)
            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/orders/**

